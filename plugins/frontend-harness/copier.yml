# Harness template. The `frontend-harness` skill fills these answers from modules.json;
# run by hand: uvx copier copy --trust -d framework=nextjs -d 'modules=["core"]' <this repo> .
# Copier keeps the answers and the version; template/ holds only its answers file.
# Every other file comes from modules.json and files/ through tasks/apply.mjs.
_subdirectory: template
_answers_file: .copier-answers.yml
_templates_suffix: ""
_tasks:
  # On install: writes the chosen modules into the project.
  - command: &apply "test -f package.json || exit 0; node '{{ _copier_conf.src_path }}/tasks/apply.mjs' '{{ _copier_conf.src_path }}' '{{ framework }}' '{{ modules | tojson }}' '{{ skip_checks | tojson }}' '{{ docs_language }}'"
    when: "{{ _copier_operation == 'copy' }}"
_migrations:
  # On update: the same, but after Copier has merged the project's own changes back in,
  # so a removed module's skills and scripts stay removed.
  - command: *apply
    when: "{{ _stage == 'after' }}"

framework:
  type: str
  help: Frontend framework
  choices:
    React (Vite): react
    Next.js: nextjs

modules:
  type: json
  help: Harness modules to install (ids from modules.json)
  default: ["core"]
  validator: "{% if 'core' not in modules %}core is required{% endif %}"

skip_checks:
  type: json
  help: Checks to turn off in this project (names from modules.json)
  default: []


docs_language:
  type: str
  help: Language of specs and plans
  default: English
