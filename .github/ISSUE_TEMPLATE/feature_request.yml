name: Feature request
description: A new module, check or rule, or a change to an existing one
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What goes wrong or takes too long when you work with Claude Code today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like the harness to do
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
