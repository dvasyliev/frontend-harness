# Runs on GitHub what the local git hooks run: commitlint on the commit messages of a pull
# request, and `claude plugin validate` on the marketplace and the plugin. The smoke job installs
# the harness with every module into a new React and a new Next.js project, then runs it again
# and expects no change, so a broken apply.mjs or module never reaches a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate plugins/frontend-harness

  commitlint:
    # Dependabot's commit bodies hold release notes with long lines that commitlint rejects.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - framework: nextjs
            linter: eslint
            package: '{"name":"smoke","private":true,"scripts":{"dev":"next dev"},"dependencies":{"next":"16.0.0","react":"19.2.0","react-dom":"19.2.0"}}'
          - framework: react
            linter: oxlint
            package: '{"name":"smoke","private":true,"scripts":{"dev":"vite"},"dependencies":{"react":"19.2.0","react-dom":"19.2.0"},"devDependencies":{"vite":"7.0.0"}}'
    env:
      HARNESS_NO_INSTALL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the harness with every module
        run: |
          mkdir "$RUNNER_TEMP/app" && cd "$RUNNER_TEMP/app"
          git init -q && echo '${{ matrix.package }}' > package.json
          modules='"core","feature-workflow","${{ matrix.linter }}","knip","jscpd","tailwind","unit","e2e","commitlint","pre-commit","sync-deps","best-practices","context7","libraries","next-docs","page-speed"'
          node "$GITHUB_WORKSPACE/plugins/frontend-harness/tasks/apply.mjs" "{\"framework\":\"${{ matrix.framework }}\",\"modules\":[$modules]}"
          for f in CLAUDE.md .claude/harness.json .claude/settings.json .claude/hooks/check-all.sh .githooks/pre-commit; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Run it again and expect no change
        run: |
          cd "$RUNNER_TEMP/app"
          git add -A
          node "$GITHUB_WORKSPACE/plugins/frontend-harness/tasks/apply.mjs" '{}'
          git diff --exit-code
